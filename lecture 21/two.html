<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 2px solid black;
            background-color: bisque;
            display: flex;
            flex-direction: row;
            width: 450px;
        }
        #boxleft{
            background-color: aquamarine;
            border: 1px solid blue;
            width: 50%;
            margin: 2px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        #boxright{
            background-color: yellow;
            border: 1px solid blue;
            width: 47%;
            margin: 2px;
            padding: 10px;

        }
        p{
            border: 1px solid red;
        }
        img{
            width: 170px;
        }
        @media(max-width: 640px) {
            .container{
                flex-direction: column;
            }
            
        }

    </style>
</head>
<body>


    <div class="container">
        <div id ="boxleft">
           <p>text1</p>
           <p>text2</p>

        </div>
        <div id="boxright">
            <img src="book navbar image.avif" alt="" height="200px">
        </div>
    </div>
    
</body>
</html>
