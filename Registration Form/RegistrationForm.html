<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student resgistration form</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
     <div class ="title">
        <h1>Student Registration Form</h1>
    </div> 
   <fieldset>
    <legend>Personal Details</legend>
     <div class="section">

        
     

    <h2 class="section-title">Personal Information</h2>

    <div class="form-grid">

        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" placeholder="Enter your full name" required>
        </div>
        <br>

        <div class="form-group">
            <label>Date of Birth :</label>
            <input type="date" required>
        </div>
        <br>

        <div class="form-group">
            <label>Gender:</label>
            
            <div class="gender">
                <label>
                    <input type="radio" name="gender" value="male" required>
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="other">
                    Other
                </label>
            </div>
        
        </div>
        <br>

        <div class="form-group">
            <label>Profile Photo:</label>
            <input type="file" accept="image/*">
        </div>

    </div>

</div>
    <br>
    <br>
 
    <!-- email section -->
    

    <label for="email">Enter email :</label>
    <input type="text" name="email" id="email" placeholder="Enter email here" required>

    <!-- enter mobile  -->
     <label for="mobilenumber">Mobile number: </label>
     <input type="text" name="mobilenumber" id="mobilenumber" placeholder="Enter mobile number">

  <br>
  <br>

  <!--  address hai yha -->
<label for="address">Address :</label>
<br>
<textarea name="address" id="address" rows="4" placeholder="Enter your address here"></textarea>
<br>
<br>

<!-- city and state -->
<div class="form-group">
    <label>City : </label>
    <input type="text" placeholder="Enter your city" required>
</div>

<br>

<div class="form-group">
    <label>State: </label>
    <input type="text" placeholder="Enter your state" required>
</div>

</fieldset>
<br>


 <!-- academic information -->

 <fieldset>
    <legend>Academic Information</legend>
     
     <div class="section">
    <h2 class="section-title">Academic Information</h2>

    <div class="form-grid">

        <div>
            <label>Enrollment Number:</label>
            <input type="text" placeholder="Enter enrollment number" required>
        </div>
        <br>

        <div class="form-group">
            <label>Course:</label>
            <select required>
                <option value="">Select Course</option>
                <option>BCA</option>
                <option>B.Tech</option>
                <option>MCA</option>
                <option>MBA</option>
                <option>Other</option>
            </select>
        </div>

        <br>

        <div class="form-group">
            <label>Department / Branch:</label>
            <input type="text" placeholder="Enter department or branch" required>
        </div>


        <br>

        <div class="form-group">
            <label>Year / Semester:</label>
            <select required>
                <option value="">Select Year / Semester</option>
                <option>1st Year - 1st Semester</option>
                <option>1st Year - 2nd Semester</option>
                <option>2nd Year - 3rd Semester</option>
                <option>2nd Year - 4th Semester</option>
                <option>3rd Year - 5th Semester</option>
                <option>3rd Year - 6th Semester</option>
            </select>
        </div>
 
    </div>
</div>
 </fieldset>
 <br>

<!-- parent guardian section hai  -->
   <fieldset>
    <legend>Parent Details</legend>
    <h2>Parent / Guardian Details</h2>

<div class="form-grid">
    <div class="form-group">
        <label for="parentName">Parent / Guardian Name:</label>
        <input type="text" id="parentName" placeholder="Enter parent or guardian name" required>
    </div>
    <br>

    <div class="form-group">
        <label for="parentRelation">Relation:</label>
        <select id="parentRelation" required>
            <option>Select relation</option>
            <option>Father</option>
            <option>Mother</option>
            <option>Guardian</option>
        </select>
    </div>
    <br>

    <div class="form-group">
        <label for="parentMobile">Contact Number <span>*</span></label>
        <input type="tel" id="parentMobile" placeholder="Enter contact number" required>
    </div>
    <br>

    <div class="form-group">
        <label for="parentEmail">Email Address</label>
        <input type="email" id="parentEmail" placeholder="Enter email address">
    </div>
    <br>
</div>
   </fieldset>
   <br>

<!-- account details hai ye -->

 <fieldset>
    <legend>Account Details</legend>
   <h2>
    Account Details
</h2>
<br>

<label for="passworld">Passworld:</label>
<input type="password" name="passworld" id="passworld" placeholder="Create a strong password">

<label for="confirmpassworld">Confirm Passworld:</label>
<input type="password" name="passworld" id="confirmpassworld" placeholder="Re-enter your password">

<br>
<br>

 
<input type="checkbox" name="agreepolicy" id="agreepolicy">
 <label for="agreepolicy">I agree to the terms & condition</label>
<br>
<br>
 <button class = "button">
    Create Account 
 </button>
 <br>
 <br>

<div class="login">
    Already have an account?
    <a href="#">Login</a>
</div>
 </fieldset>
 <br>
</form>
</body>
</html>
